<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Nefs · Personal Hub</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* custom smooth gradient & minimal glow */
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.25) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 2;
    }
    .hub-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s;
    }
    .hub-card:hover {
      transform: scale(1.03);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .tab-btn {
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      border-bottom-color: #a78bfa;
      color: #e9d8fd;
      font-weight: 500;
    }
    .grid-fade {
      transition: opacity 0.2s ease-in-out;
    }
    .profile-ring {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15), 0 12px 28px -8px black;
    }
  </style>
</head>
<body class="font-sans antialiased text-white flex items-center justify-center p-4 md:p-6">
  <div id="app" class="w-full max-w-2xl mx-auto flex flex-col items-center">
    
    <!-- HEADER -->
    <div class="text-center mt-2 mb-6">
      <img 
        src="https://i.ibb.co.com/5xM0NmFM/file-00000000af887208a1bbb09007ccd32f.png" 
        alt="Nefs profile" 
        class="w-28 h-28 md:w-32 md:h-32 rounded-full mx-auto object-cover profile-ring"
        loading="eager"
      >
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-5 bg-gradient-to-r from-[#f06] to-[#9f6] bg-clip-text text-transparent drop-shadow-lg">
        NEFS GTPS
      </h1>
      <p class="text-white/80 text-sm md:text-base max-w-md mx-auto mt-2 leading-relaxed px-2">
        "My goal is 500 Subscriber! And now it's been achieved thank you! NEXT 1K? xD"
      </p>
    </div>

    <!-- CATEGORY TABS -->
    <div class="flex flex-wrap justify-center gap-1 sm:gap-3 mb-7 w-full px-2">
      <button data-cat="gtps" class="tab-btn active px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">GTPS</button>
      <button data-cat="nefs" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">NEFS STORE & COMMUNITY</button>
      <button data-cat="host" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">APLIKASI HOST</button>
      <button data-cat="social" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">SOCIAL MEDIA</button>
    </div>

    <!-- GRID CONTAINER -->
    <div id="gridContainer" class="w-full grid grid-cols-2 md:grid-cols-3 gap-4 transition-opacity duration-200 grid-fade">
      <!-- dinamis dari JS -->
    </div>

    <!-- FOOTER -->
    <div class="mt-8 text-white/40 text-xs border-t border-white/10 pt-5 w-full text-center">
      <span class="inline-block w-2 h-2 bg-emerald-400 rounded-full mr-1.5 align-middle"></span> online · Nefs Hub
      <span class="mx-2">•</span> © 2025 · clean grid
    </div>
  </div>

  <script>

        },
        
        // ==================== NEFS STORE & COMMUNITY ====================
        {

        {

        },
        {

        },

        },
        
        // ==================== APLIKASI HOST ====================
        {

        },

          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/FkCmRT4Z/6579ce4111f4b-com-github-xfalcon-vhosts-transfer-2026-04-13-214155.png',
        },
        
        // ==================== SOCIAL MEDIA ====================
        { 
          category: 'social',

          iconClass: 'fab fa-youtube',
        },
        { 
          category: 'social', 
          title: 'TikTok', 
          url: 'https://www.tiktok.com/@lynnn7250?_r=1&_t=ZS-95VXToZeyZu',

        },
        { 
          category: 'social', 
          title: 'Instagram', 
          url: 'https://instagram.com/',
          iconType: 'fa',
          iconClass: 'fab fa-instagram',
        }
      ];

      // ---------- DOM elements ----------
      const grid = document.getElementById('gridContainer');
      const tabs = document.querySelectorAll('[data-cat]');
      
      let activeCategory = 'gtps';

      // ---------- RENDER (filter enabled !== false) ----------
      function renderGrid(category) {
        const filtered = items.filter(item => 
          item.category === category && item.enabled !== false
        );
        
        let html = '';
        filtered.forEach(item => {
          let iconMarkup = '';
          if (item.iconType === 'img') {
            iconMarkup = `<img src="${item.iconSrc}" alt="${item.title}" class="w-12 h-12 md:w-14 md:h-14 object-contain rounded-xl" loading="lazy">`;
          } else {
            iconMarkup = `<i class="${item.iconClass} text-4xl md:text-5xl"></i>`;
          }
          
          html += `
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
               class="hub-card rounded-2xl p-4 flex flex-col items-center text-center no-underline text-white group">
              <div class="w-full flex justify-center mb-3 min-h-[56px] items-center">
                ${iconMarkup}
              </div>
              <h3 class="font-semibold text-sm md:text-base tracking-wide leading-tight break-words w-full">
                ${item.title}
              </h3>
            </a>
          `;
        });
        
        grid.style.opacity = '0.6';
        setTimeout(() => {
          grid.innerHTML = html;
          grid.style.opacity = '1';
        }, 30);
      }

      // ---------- TAB SWITCHING ----------
      function setActiveTab(category) {
        activeCategory = category;
        tabs.forEach(btn => {
          const cat = btn.getAttribute('data-cat');
          btn.classList.toggle('active', cat === category);
        });
        renderGrid(category);
      }

      // ---------- EVENT LISTENERS ----------
      tabs.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cat = btn.getAttribute('data-cat');
          if (cat && cat !== activeCategory) {
            setActiveTab(cat);
          }
          e.preventDefault();
        });
      });

      // ---------- INIT ----------
      document.querySelector('[data-cat="gtps"]').classList.add('active');
      renderGrid('gtps');

    })();
  </script>
  <!-- 
    CATATAN PENTING:
    - Semua item di kategori GTPS sekarang memiliki properti "enabled: true/false".
    - Ubah nilai enabled menjadi false untuk menyembunyikan item, true untuk menampilkan.
    - Contoh: "Eldoria WhatsApp" jika ingin disembunyikan, ubah enabled: false
    - Fitur ini juga bisa diterapkan di kategori lain dengan menambahkan properti enabled pada item tersebut.
  -->
</body>
</html>
