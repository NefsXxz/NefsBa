<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Nefs · Personal Hub</title>
  <!-- TailwindCSS CDN (lightweight) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 (icons only for allowed SVG icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* custom smooth gradient & minimal glow — exactly like reference but lighter */
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
      min-height: 100vh;
      position: relative;
    }
    /* MAX 2 radial glows — soft, no performance hit */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.25) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    /* all content above glow */
    #app {
      position: relative;
      z-index: 2;
    }
    /* card base style — matches glassmorphism from ref, but cleaner */
    .hub-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s;
    }
    .hub-card:hover {
      transform: scale(1.03);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
    }
    /* category tabs — clean underline effect */
    .tab-btn {
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      border-bottom-color: #a78bfa;
      color: #e9d8fd;
      font-weight: 500;
    }
    /* fade transition for grid content — lightweight */
    .grid-fade {
      transition: opacity 0.2s ease-in-out;
    }
    /* profile image ring */
    .profile-ring {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15), 0 12px 28px -8px black;
    }
    /* no heavy animations, no floating icons */
  </style>
</head>
<body class="font-sans antialiased text-white flex items-center justify-center p-4 md:p-6">
  <div id="app" class="w-full max-w-2xl mx-auto flex flex-col items-center">
    
    <!-- HEADER (center, clean) -->
    <div class="text-center mt-2 mb-6">
      <!-- Profile pic — replace with your own i.ibb link -->
      <img 
        src="https://i.ibb.co.com/5xM0NmFM/file-00000000af887208a1bbb09007ccd32f.png" 
        alt="Nefs profile" 
        class="w-28 h-28 md:w-32 md:h-32 rounded-full mx-auto object-cover profile-ring"
        loading="eager"
      >
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-5 bg-gradient-to-r from-[#f06] to-[#9f6] bg-clip-text text-transparent drop-shadow-lg">
        NEFS GTPS
      </h1>
      <p class="text-white/80 text-sm md:text-base max-w-md mx-auto mt-2 leading-relaxed px-2">
        "My goal is 500 Subscriber! And now it's been achieved thank you! NEXT 1K? xD"
      </p>
    </div>

    <!-- CATEGORY TABS (menu, no reload) -->
    <div class="flex flex-wrap justify-center gap-1 sm:gap-3 mb-7 w-full px-2">
      <button data-cat="gtps" class="tab-btn active px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">GTPS</button>
      <button data-cat="nefs" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">NEFS STORE & COMMUNITY</button>
      <button data-cat="host" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">APLIKASI HOST</button>
      <button data-cat="social" class="tab-btn px-4 py-2 text-sm sm:text-base font-medium text-white/80 hover:text-white transition">SOCIAL MEDIA</button>
    </div>

    <!-- GRID CONTAINER (cards) -->
    <div id="gridContainer" class="w-full grid grid-cols-2 md:grid-cols-3 gap-4 transition-opacity duration-200 grid-fade">
      <!-- dynamically rendered via JS -->
    </div>

    <!-- subtle footer (optional, like reference) -->
    <div class="mt-8 text-white/40 text-xs border-t border-white/10 pt-5 w-full text-center">
      <span class="inline-block w-2 h-2 bg-emerald-400 rounded-full mr-1.5 align-middle"></span> online · Nefs Hub
      <span class="mx-2">•</span> © 2025 · clean grid
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      // ---------- DATA ITEMS (12 total) ----------
      const items = [
        // GTPS (3)
        { 
          category: 'gtps', 
          title: 'Growthaven WhatsApp', 
          url: 'https://chat.whatsapp.com/GTLfZoXYFgY501NnLeiWSC?mode=gi_t',
          iconType: 'img',   // wajib img (bisa diganti i.ibb)
          iconSrc: 'https://i.ibb.co.com/Sw8z8Mgq/IMG-20260407-132356-149.jpg',   // placeholder, ganti dengan i.ibb nanti
        },
        { 
          category: 'gtps', 
          title: 'All Host Growthaven', 
          url: 'https://gtpshost.com/d/GROWHAVEN-GH',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/Sw8z8Mgq/IMG-20260407-132356-149.jpg',
        },
        { 
          category: 'gtps', 
          title: 'Growthaven APK', 
          url: 'https://www.mediafire.com/file/zzrvu008a9l07y8/GROWHAVEN.apk/file',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/Sw8z8Mgq/IMG-20260407-132356-149.jpg',
        },
        
        // NEFS STORE & COMMUNITY (3)
        { 
          category: 'nefs', 
          title: 'Nefs Community', 
          url: 'https://chat.whatsapp.com/GTLfZoXYFgY501NnLeiWSC?mode=gi_t',
          iconType: 'fa',    // WAJIB icon whatsapp (SVG bawaan)
          iconClass: 'fab fa-whatsapp',
        },
        { 
          category: 'nefs', 
          title: 'Discord Group', 
          url: 'https://discord.gg/FYhKqEvhHh',
          iconType: 'fa',
          iconClass: 'fab fa-discord',
        },
        { 
          category: 'nefs', 
          title: 'Digital Store', 
          url: 'https://nefs-storee.vercel.app/',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/nsJpKmJn/file-00000000bce071fab85724add9068e8e.png',
        },
        
        // APLIKASI HOST (3)
        { 
          category: 'host', 
          title: 'Hosts GO', 
          url: 'https://example.com/hostsgo',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/N2nMwq6H/23ec4ca387202bc058ee85e45ac00907-icon-transfer-2026-04-13-214033.png',
        },
        { 
          category: 'host', 
          title: 'PowerTunnel', 
          url: 'https://example.com/powertunnel',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/tPq57wNG/3d9119f632a430bcb59c4bbca01152c0c7b1703e649ff6caa27334f6ca967515-200-transfer-2026-04-13-214215.webp',
        },
        { 
          category: 'host', 
          title: 'Virtual Host', 
          url: 'https://example.com/virtualhost',
          iconType: 'img',
          iconSrc: 'https://i.ibb.co.com/FkCmRT4Z/6579ce4111f4b-com-github-xfalcon-vhosts-transfer-2026-04-13-214155.png',
        },
        
        // SOCIAL MEDIA (3)
        { 
          category: 'social', 
          title: 'YouTube', 
          url: 'https://youtube.com/@nefsgtps1',
          iconType: 'fa',
          iconClass: 'fab fa-youtube',
        },
        { 
          category: 'social', 
          title: 'TikTok', 
          url: 'https://tiktok.com/',
          iconType: 'fa',
          iconClass: 'fab fa-tiktok',
        },
        { 
          category: 'social', 
          title: 'Instagram', 
          url: 'https://instagram.com/',
          iconType: 'fa',
          iconClass: 'fab fa-instagram',
        }
      ];

      // ---------- DOM elements ----------
      const grid = document.getElementById('gridContainer');
      const tabs = document.querySelectorAll('[data-cat]');
      
      // active category (default: gtps)
      let activeCategory = 'gtps';

      // ---------- RENDER FUNCTION (lightweight, no heavy ops) ----------
      function renderGrid(category) {
        // filter items
        const filtered = items.filter(item => item.category === category);
        
        // build HTML string (fast)
        let html = '';
        filtered.forEach(item => {
          // determine icon markup
          let iconMarkup = '';
          if (item.iconType === 'img') {
            // IMG logo — ready for i.ibb replacement
            iconMarkup = `<img src="${item.iconSrc}" alt="${item.title}" class="w-12 h-12 md:w-14 md:h-14 object-contain rounded-xl" loading="lazy">`;
          } else {
            // Font Awesome icon (SVG bawaan)
            iconMarkup = `<i class="${item.iconClass} text-4xl md:text-5xl"></i>`;
          }
          
          // card structure
          html += `
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
               class="hub-card rounded-2xl p-4 flex flex-col items-center text-center no-underline text-white group">
              <div class="w-full flex justify-center mb-3 min-h-[56px] items-center">
                ${iconMarkup}
              </div>
              <h3 class="font-semibold text-sm md:text-base tracking-wide leading-tight break-words w-full">
                ${item.title}
              </h3>
            </a>
          `;
        });
        
        // apply fade: set opacity to 0.5 quickly then update & restore
        grid.style.opacity = '0.6';
        setTimeout(() => {
          grid.innerHTML = html;
          grid.style.opacity = '1';
        }, 30); // tiny delay for smooth perception
      }

      // ---------- TAB SWITCHING (lightweight) ----------
      function setActiveTab(category) {
        activeCategory = category;
        
        // update active class on buttons
        tabs.forEach(btn => {
          const cat = btn.getAttribute('data-cat');
          if (cat === category) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        
        renderGrid(category);
      }

      // ---------- EVENT LISTENERS (no ripple, no heavy) ----------
      tabs.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cat = btn.getAttribute('data-cat');
          if (cat && cat !== activeCategory) {
            setActiveTab(cat);
          }
          // prevent any default if needed
          e.preventDefault();
        });
      });

      // ---------- INITIAL RENDER (GTPS active) ----------
      // set default active tab styling (already has 'active' class in HTML on GTPS)
      // but ensure data consistency
      const defaultActive = document.querySelector('[data-cat="gtps"]');
      if(defaultActive) defaultActive.classList.add('active');
      renderGrid('gtps');

      // ---------- EXTRA LIGHTWEIGHT: no floating, no ripple, no infinite loops ----------
      // Preload subtle improvement: if any image fails, it's fine.
      
      // Optional: handle very small screen touch optimizations (nothing heavy)
      
    })();
  </script>
  <!-- no extra libraries, pure vanilla & tailwind -->
  <!-- background radial glows already in CSS ::before — max 2, smooth -->
  <!-- Catatan: semua logo img menggunakan placeholder, siap diganti dengan link i.ibb.com sesuai keinginan -->
  <!-- untuk ikon wajib (whatsapp,discord,youtube,tiktok,ig) sudah pakai fontawesome svg -->
</body>
</html>
